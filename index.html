<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b22">
<title>Simmi Voice Assistant</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:
  radial-gradient(circle at 20% 10%,#123b80,transparent 35%),
  radial-gradient(circle at 90% 20%,#35135f,transparent 35%),
  #020617;
  color:#fff;
  font-family:Arial,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer;border:0;color:white}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding-bottom:85px;
  background:linear-gradient(180deg,#061333,#02091f);
}

header{
  height:75px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
}

.logo{
  width:43px;height:43px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:22px;
  font-weight:bold;
  background:linear-gradient(135deg,#079cff,#8c35ff);
  box-shadow:0 0 30px #168cff55;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.brand b{font-size:18px}
.brand small{
  display:block;
  color:#8298be;
  font-size:9px;
  margin-top:3px;
  letter-spacing:1.5px;
}

.topbtn{
  width:40px;height:40px;
  border-radius:13px;
  background:#ffffff0b;
  border:1px solid #ffffff15;
}

main{padding:10px 17px}

.greet small{color:#8298be}
.greet h1{
  margin:5px 0 17px;
  font-size:29px;
}
.greet span{
  background:linear-gradient(90deg,#fff,#50e1ff,#a76cff);
  -webkit-background-clip:text;
  color:transparent;
}

.assistant{
  border-radius:30px;
  padding:22px 17px;
  background:
  radial-gradient(circle at 50% 35%,#1163b833,transparent 35%),
  linear-gradient(145deg,#0c285dcc,#030b25);
  border:1px solid #54c9ff35;
  box-shadow:0 25px 80px #0008;
}

.status{
  text-align:center;
  color:#8ca1c5;
  font-size:10px;
  letter-spacing:1.5px;
}
.status strong{
  display:block;
  margin-top:5px;
  color:white;
  font-size:16px;
  letter-spacing:0;
}

.status strong.listening{color:#51e6ff}

.voiceArea{
  height:250px;
  display:grid;
  place-items:center;
  position:relative;
}

.ring{
  position:absolute;
  width:210px;height:210px;
  border-radius:50%;
  border:1px solid #2bbdff38;
  box-shadow:0 0 45px #159dff1c inset;
}

.ring:before{
  content:"";
  position:absolute;
  inset:17px;
  border-radius:50%;
  border:1px solid #70ddff25;
}

.mic{
  width:135px;height:135px;
  border-radius:50%;
  background:radial-gradient(circle,#123e88,#061a42 70%);
  border:2px solid #2bc8ff88;
  box-shadow:0 0 0 12px #188cff12,0 0 50px #08caff44;
  font-size:48px;
  position:relative;
  z-index:2;
}

.mic.active{
  border-color:#51edff;
  box-shadow:0 0 0 14px #188cff1c,0 0 75px #00d9ff99;
  animation:pulse 1.3s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.06)}
}

.version{
  text-align:center;
  color:#8297b8;
  font-size:9px;
  letter-spacing:2px;
}

.location,.reply{
  margin-top:14px;
  padding:14px;
  border-radius:17px;
  background:#ffffff08;
  border:1px solid #ffffff12;
}

.location small{
  color:#7186a8;
  font-size:9px;
}

.location b{
  display:block;
  margin-top:6px;
  font-size:12px;
}

.reply{
  display:none;
}
.reply.show{display:block}

.reply label{
  color:#4ce2ff;
  font-size:9px;
  letter-spacing:1px;
}
.reply p{
  margin-top:6px;
  color:#dce9ff;
  font-size:13px;
  line-height:1.5;
}

.section{
  display:flex;
  justify-content:space-between;
  margin:21px 3px 10px;
}
.section b{font-size:14px}
.section small{color:#7085a7}

.quick{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.quick button{
  min-height:75px;
  padding:13px;
  text-align:left;
  border-radius:17px;
  background:#ffffff08;
  border:1px solid #ffffff12;
}

.quick button:active{transform:scale(.97)}
.quick i{font-style:normal;font-size:20px}
.quick b{
  display:block;
  margin-top:7px;
  font-size:12px;
}
.quick small{
  color:#7186a8;
  font-size:9px;
}

.input{
  margin-top:14px;
  padding:7px;
  display:flex;
  gap:7px;
  border-radius:18px;
  background:#ffffff0b;
  border:1px solid #ffffff15;
}

.input input{
  flex:1;
  min-width:0;
  outline:0;
  border:0;
  background:transparent;
  color:white;
  padding:10px;
  font-size:12px;
}

.input input::placeholder{color:#617697}

.send{
  width:45px;
  border-radius:13px;
  background:linear-gradient(135deg,#098fff,#713cff);
}

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  height:75px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#030b20ee;
  backdrop-filter:blur(20px);
  border-top:1px solid #ffffff10;
  z-index:10;
}

.nav button{
  background:transparent;
  color:#63799c;
  font-size:19px;
}
.nav button small{
  display:block;
  font-size:8px;
  margin-top:4px;
}
.nav button.active{color:#4bdfff}

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  padding:11px 15px;
  border-radius:14px;
  background:#0b1b3bee;
  border:1px solid #43caff33;
  font-size:11px;
  display:none;
  z-index:20;
}
.toast.show{display:block}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <div class="logo">S</div>
    <div>
      <b>SIMMI</b>
      <small>VOICE ASSISTANT</small>
    </div>
  </div>
  <button class="topbtn" onclick="showToast('Simmi is ready')">☼</button>
</header>

<main>

<div class="greet">
  <small id="greeting">Good morning</small>
  <h1>Hello, <span>Simmi</span> 👋</h1>
</div>

<section class="assistant">

  <div class="status">
    ASSISTANT STATUS
    <strong id="status">Ready to listen</strong>
  </div>

  <div class="voiceArea">
    <div class="ring"></div>
    <button class="mic" id="mic">🎙️</button>
  </div>

  <div class="version">SIMMI • AI VOICE ASSISTANT</div>

  <div class="location">
    <small>📍 CURRENT LOCATION</small>
    <b id="location">Location permission not requested</b>
  </div>

  <div class="reply" id="reply">
    <label>SIMMI RESPONSE</label>
    <p id="replyText"></p>
  </div>

</section>

<div class="section">
  <b>Quick actions</b>
  <small>Tap to ask</small>
</div>

<div class="quick">

<button onclick="ask('What is the current time?')">
<i>🕐</i>
<b>Time</b>
<small>Current time</small>
</button>

<button onclick="ask('What is today?')">
<i>📅</i>
<b>Date</b>
<small>Today's date</small>
</button>

<button onclick="ask('Tell me a short joke')">
<i>✨</i>
<b>Joke</b>
<small>Make me laugh</small>
</button>

<button onclick="ask('Who are you?')">
<i>🤖</i>
<b>About Simmi</b>
<small>Ask Simmi</small>
</button>

</div>

<div class="input">
  <input id="input" placeholder="Type anything to ask Simmi...">
  <button class="send" onclick="send()">➤</button>
</div>

</main>

<nav class="nav">
  <button class="active" onclick="home()">🏠<small>Home</small></button>
  <button onclick="showToast('History coming soon')">🕘<small>History</small></button>
  <button onclick="showToast('Settings coming soon')">⚙️<small>Settings</small></button>
  <button onclick="showToast('Simmi AI Assistant')">ⓘ<small>About</small></button>
</nav>

</div>

<div class="toast" id="toast"></div>

<script>
const mic=document.getElementById("mic");
const statusEl=document.getElementById("status");
const reply=document.getElementById("reply");
const replyText=document.getElementById("replyText");
const input=document.getElementById("input");
const locationEl=document.getElementById("location");

let recognition=null;
let listening=false;

/* Greeting */
const hour=new Date().getHours();
document.getElementById("greeting").textContent=
  hour<12 ? "Good morning" :
  hour<17 ? "Good afternoon" : "Good evening";

/* Toast */
let toastTimer;
function showToast(text){
  const t=document.getElementById("toast");
  t.textContent=text;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),2500);
}

/* Voice recognition */
const SpeechRecognition=
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if(SpeechRecognition){

  recognition=new SpeechRecognition();

  recognition.lang="en-IN";
  recognition.continuous=false;
  recognition.interimResults=false;

  recognition.onstart=()=>{
    listening=true;
    mic.classList.add("active");
    statusEl.textContent="Listening...";
    statusEl.classList.add("listening");
  };

  recognition.onresult=e=>{
    const text=e.results[0][0].transcript;
    input.value=text;
    ask(text);
  };

  recognition.onerror=e=>{
    showToast(
      e.error==="not-allowed"
      ? "Microphone permission denied"
      : "Voice error. Try again."
    );
  };

  recognition.onend=()=>{
    listening=false;
    mic.classList.remove("active");
    statusEl.classList.remove("listening");
    statusEl.textContent="Ready to listen";
  };

}else{
  showToast("Use Chrome for voice recognition");
}

/* Mic button */
mic.onclick=()=>{
  if(!recognition){
    showToast("Voice recognition not supported");
    return;
  }

  if(listening){
    recognition.stop();
  }else{
    try{
      recognition.start();
    }catch(e){}
  }
};

/* Ask AI */
async function ask(message){

  message=String(message||"").trim();

  if(!message){
    showToast("Please say or type something");
    return;
  }

  reply.classList.add("show");
  replyText.textContent="Simmi is thinking...";
  statusEl.textContent="Thinking...";

  try{

    const response=await fetch("/api/chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:message
      })
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error || "AI request failed");
    }

    const answer=data.reply || "Sorry, I could not answer that.";

    replyText.textContent=answer;
    statusEl.textContent="Ready to listen";

    speak(answer);

  }catch(error){

    console.error(error);

    replyText.textContent=
      "Sorry, Simmi could not connect to the AI server.";

    statusEl.textContent="Connection error";

    showToast("AI connection failed");
  }
}

/* Send typed message */
function send(){
  const text=input.value.trim();

  if(!text)return;

  input.value="";
  ask(text);
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter")send();
});

/* Speak AI response */
function speak(text){

  if(!("speechSynthesis" in window))return;

  speechSynthesis.cancel();

  const voice=new SpeechSynthesisUtterance(text);

  voice.lang=
    /[\u0900-\u097F]/.test(text)
    ? "hi-IN"
    : "en-IN";

  voice.rate=.95;
  voice.pitch=1;

  speechSynthesis.speak(voice);
}

/* Location */
if(navigator.geolocation){

  navigator.geolocation.getCurrentPosition(
    position=>{
      const lat=position.coords.latitude.toFixed(5);
      const lon=position.coords.longitude.toFixed(5);

      locationEl.textContent=
        `GPS available • ${lat}, ${lon}`;
    },
    ()=>{
      locationEl.textContent=
        "Location permission not granted";
    }
  );
}

/* Home */
function home(){
  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}
</script>

</body>
</html>
